    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, -10, 40, 0, TAU); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4;
    ctx.strokeStyle = '#7a5428'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(13, 20); ctx.lineTo(15, -24); ctx.quadraticCurveTo(15, -30, 10, -29); ctx.stroke();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4;
    ctx.fillStyle = '#f4f0e4';
    ctx.beginPath(); ctx.moveTo(-14, 20); ctx.quadraticCurveTo(-15, -4, -7, -8); ctx.lineTo(7, -8); ctx.quadraticCurveTo(15, -4, 14, 20); ctx.quadraticCurveTo(0, 24, -14, 20); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = C.gold; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 21); ctx.stroke();
    ctx.fillStyle = '#e6b88e'; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -15, 7, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-6, -14); ctx.quadraticCurveTo(-7, 0, 0, 8); ctx.quadraticCurveTo(7, 0, 6, -14); ctx.quadraticCurveTo(0, -10, -6, -14); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(-2.4, -16, 0.9, 0, TAU); ctx.arc(2.4, -16, 0.9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-7.5, -18); ctx.quadraticCurveTo(-8, -28, 0, -29); ctx.quadraticCurveTo(8, -28, 7.5, -18); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = C.gold; ctx.beginPath(); ctx.moveTo(-7, -20); ctx.lineTo(7, -20); ctx.stroke();
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    if (e.spawn > 0) {
      const t = 1 - e.spawn / 0.9;
      ctx.save(); ctx.globalAlpha = 0.8 * (1 - t);
      koshkar(ctx, e.x, e.y - 4, 22 + e.r, '#ffe28a', 2.5);
      ctx.restore();
      ctx.globalAlpha = clamp(t * 1.3, 0, 1);
      ctx.translate(e.x, e.y); ctx.scale(0.4 + 0.6 * t, 0.4 + 0.6 * t); ctx.translate(-e.x, -e.y);
    }
    switch (e.type) {
      case 'w': drawWolf(e); break;
      case 's': drawSpider(e); break;
      case 'j': drawZhez(e); break;
      case 'a': drawGhost(e); break;
      case 'm': drawWitch(e); break;
      case 'D': drawDau(e); break;
      case 'J': drawJalmauyz(e); break;
      case 'A': drawDragon(e); break;
    }
    ctx.restore();
    if (e.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(e.x, e.y - 2, e.r, 0, TAU); ctx.fill(); }
    if (e.burn > 0) { ctx.fillStyle = `rgba(255,120,30,${0.35 + Math.sin(time * 20) * 0.15})`; ctx.beginPath(); ctx.arc(e.x, e.y - e.r * 0.4, 4, 0, TAU); ctx.fill(); }
    if (e.slow > 0) { ctx.strokeStyle = 'rgba(160,220,255,0.8)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, TAU); ctx.stroke(); }
    if (!e.boss && e.spawn <= 0 && e.hp < e.maxHp) {
      const w = e.r * 2 + 6, x = e.x - w / 2, y = e.y - e.r - 14;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 1, y - 1, w + 2, 5);
      ctx.fillStyle = '#e0423a'; ctx.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), 3);
    }
  }

  // =================================================================== drawing: projectiles & pickups
  function drawArrow(a) {
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.ang);
    if (a.kind === 'feather') {
      ctx.fillStyle = '#e8b33a'; ctx.strokeStyle = '#6b4a10'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.quadraticCurveTo(0, -4, -8, -1); ctx.lineTo(-8, 1); ctx.quadraticCurveTo(0, 4, 8, 0); ctx.fill(); ctx.stroke();
    } else {
      if (a.fire) { ctx.fillStyle = 'rgba(255,140,40,0.5)'; ctx.beginPath(); ctx.ellipse(-4, 0, 10, 3.5, 0, 0, TAU); ctx.fill(); }
      if (a.ice) { ctx.fillStyle = 'rgba(150,220,255,0.5)'; ctx.beginPath(); ctx.ellipse(-4, 0, 10, 3, 0, 0, TAU); ctx.fill(); }
      ctx.strokeStyle = '#6b3d15'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(7, 0); ctx.stroke();
      ctx.fillStyle = '#d9d9d9'; ctx.strokeStyle = C.ink; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(6, -2.8); ctx.lineTo(6, 2.8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.red; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-13, -3); ctx.lineTo(-7, 0); ctx.lineTo(-13, 3); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawBullet(b) {
    const k = b.kind;
    if (k === 'claw') {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = '#e8892e'; ctx.strokeStyle = '#6b2f08'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(7, 0); ctx.quadraticCurveTo(0, -5, -6, -2); ctx.lineTo(-3, 0); ctx.lineTo(-6, 2); ctx.quadraticCurveTo(0, 5, 7, 0); ctx.fill(); ctx.stroke();
      ctx.restore(); return;
    }
    const cols = { magic: ['#c88bff', '#5d2a8a'], ghost: ['#e8f4ff', '#6a88a8'], rock: ['#b08a5e', '#4d3520'], boulder: ['#9c8c78', '#3d3328'], fire: ['#ffb43a', '#b3261a'] }[k] || ['#fff', '#000'];
    ctx.fillStyle = cols[0]; ctx.strokeStyle = cols[1]; ctx.lineWidth = 1.6;
    if (k === 'fire' || k === 'magic' || k === 'ghost') {
      ctx.save(); ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, TAU); ctx.fill(); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, TAU); ctx.fill();
  }

  function drawPickup(p) {
    const bob = Math.sin(time * 6 + p.x) * 1.5;
    if (p.kind === 'xp') {
      ctx.save(); ctx.translate(p.x, p.y + bob);
      ctx.fillStyle = '#3fd0e8'; ctx.strokeStyle = '#0b4f63'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(4, 0); ctx.lineTo(0, 5); ctx.lineTo(-4, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(-1, -3, 1.6, 2.4);
      ctx.restore();
    } else if (p.kind === 'coin') {
      ctx.fillStyle = C.gold; ctx.strokeStyle = C.goldDk; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(p.x, p.y + bob, 4.5, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = C.goldDk; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(p.x - 2, p.y + bob - 2); ctx.lineTo(p.x + 2, p.y + bob - 2); ctx.moveTo(p.x - 2, p.y + bob - 0.6); ctx.lineTo(p.x + 2, p.y + bob - 0.6); ctx.moveTo(p.x, p.y + bob - 0.6); ctx.lineTo(p.x, p.y + bob + 2.5); ctx.stroke();
    } else {
      heart(p.x, p.y + bob, 6, '#e8323b');
    }
  }
  function heart(x, y, s, col) {
    ctx.fillStyle = col; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x, y + s * 0.8);
    ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.35);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.8);
    ctx.fill(); ctx.stroke();
  }

  function drawGate() {
    const x = GATE_X - GATE_W / 2, y = ARENA.y - 14;
    ctx.fillStyle = '#3a2412'; ctx.fillRect(x - 6, y - 8, GATE_W + 12, 26);
    ctx.fillStyle = C.gold; ctx.fillRect(x - 6, y - 8, GATE_W + 12, 3);
    if (gateOpen > 0) {
      const gl = ctx.createLinearGradient(0, y, 0, y + 30);
      gl.addColorStop(0, `rgba(255,236,160,${0.9 * gateOpen})`); gl.addColorStop(1, 'rgba(255,236,160,0)');
      ctx.fillStyle = gl; ctx.fillRect(x, y - 5, GATE_W, 40);
    }
    const leaf = (GATE_W / 2) * (1 - gateOpen * 0.85);
    for (const [lx, w] of [[x, leaf], [x + GATE_W - leaf, leaf]]) {
      if (w < 1) continue;
      ctx.fillStyle = '#b5462a'; ctx.fillRect(lx, y - 4, w, 20);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2; ctx.strokeRect(lx, y - 4, w, 20);
      if (w > 14) koshkar(ctx, lx + w / 2, y + 5, 12, C.gold, 1.4);
    }
    if (gateOpen >= 1) {
      const b = Math.sin(time * 6) * 3;
      ctx.fillStyle = '#fff6c8'; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(GATE_X, ARENA.y + 16 + b); ctx.lineTo(GATE_X + 10, ARENA.y + 28 + b); ctx.lineTo(GATE_X + 4, ARENA.y + 28 + b); ctx.lineTo(GATE_X + 4, ARENA.y + 38 + b);
      ctx.lineTo(GATE_X - 4, ARENA.y + 38 + b); ctx.lineTo(GATE_X - 4, ARENA.y + 28 + b); ctx.lineTo(GATE_X - 10, ARENA.y + 28 + b); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  // =================================================================== drawing: UI
  function txt(s, x, y, size, col, o) {
    o = o || {};
    ctx.font = `${o.weight || 700} ${size}px ${FONT}`;
    ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
    if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.lw || size * 0.2; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
    ctx.fillStyle = col; ctx.fillText(s, x, y);
  }
  function wrap(s, x, y, maxW, lh, size, col, o) {
    ctx.font = `${(o && o.weight) || 500} ${size}px ${FONT}`;
    const words = s.split(' '), lines = [];
    let line = '';
    for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line);
    lines.forEach((l, i) => txt(l, x, y + i * lh, size, col, Object.assign({ weight: 500 }, o)));
  }

  function button(x, y, w, h, label, fn, o) {
    o = o || {};
    const col = o.col || C.gold, col2 = o.col2 || '#e08a1a';
    ctx.save();
    if (o.disabled) ctx.globalAlpha = 0.5;
    rr(ctx, x, y + 4, w, h, 12); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    rr(ctx, x, y, w, h, 12); ctx.fillStyle = C.ink; ctx.fill();
    rr(ctx, x + 3, y + 3, w - 6, h - 6, 9);
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, col); g.addColorStop(1, col2);
    ctx.fillStyle = g; ctx.fill();
    rr(ctx, x + 8, y + 6, w - 16, 5, 2.5); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
    txt(label, x + w / 2, y + h / 2 + 1, o.size || 18, '#ffffff', { stroke: C.ink, lw: 4, weight: 900 });
    ctx.restore();
    ui.push({ x, y, w, h, fn: o.disabled ? null : fn });
  }

  function panel(x, y, w, h) {
    rr(ctx, x, y + 5, w, h, 16); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    rr(ctx, x, y, w, h, 16); ctx.fillStyle = C.ink; ctx.fill();
    rr(ctx, x + 3, y + 3, w - 6, h - 6, 13); ctx.fillStyle = C.cream; ctx.fill();
    rr(ctx, x + 8, y + 8, w - 16, h - 16, 9); ctx.strokeStyle = '#d6b471'; ctx.lineWidth = 2; ctx.stroke();
    for (const [cx, cy, a] of [[x + 20, y + 20, 0], [x + w - 20, y + 20, 0], [x + 20, y + h - 20, Math.PI], [x + w - 20, y + h - 20, Math.PI]]) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a); koshkar(ctx, 0, 0, 14, C.red, 1.8); ctx.restore();
    }
  }

  function skillIcon(id, x, y, s) {
    const sd = SKILL[id];
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = C.teal; ctx.strokeStyle = C.gold; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.scale(s / 20, s / 20);
    const col = sd.col;
    const arrow = (ax, ay, a, len) => {
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
      ctx.strokeStyle = col; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.lineTo(len / 2, 0); ctx.moveTo(len / 2 - 4, -3.5); ctx.lineTo(len / 2, 0); ctx.lineTo(len / 2 - 4, 3.5); ctx.stroke();
      ctx.restore();
    };
    const U = -Math.PI / 2;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    switch (id) {
      case 'multi': arrow(0, -3, U, 14); arrow(0, 6, U, 10); break;
      case 'front': arrow(-4, 0, U, 18); arrow(4, 0, U, 18); break;
      case 'diag': arrow(0, 2, U, 16); arrow(-5, 2, U - 0.7, 16); arrow(5, 2, U + 0.7, 16); break;
      case 'side': arrow(-6, 0, Math.PI, 12); arrow(6, 0, 0, 12); ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.fill(); break;
      case 'rear': arrow(0, -5, U, 10); arrow(0, 6, Math.PI / 2, 10); break;
      case 'pierce': ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.stroke(); arrow(0, 0, 0, 24); break;
      case 'rico': ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(-2, -6); ctx.lineTo(4, 4); ctx.stroke(); arrow(7, -1, -0.9, 9); break;
      case 'wall': ctx.fillRect(7, -11, 3, 22); ctx.beginPath(); ctx.moveTo(-10, -8); ctx.lineTo(5, 0); ctx.stroke(); arrow(-2, 6, Math.PI - 0.5, 12); break;
      case 'atk': arrow(0, 0, U + 0.6, 20); arrow(0, 0, U - 0.6, 20); break;
      case 'spd': arrow(3, 0, 0, 14); ctx.beginPath(); ctx.moveTo(-11, -5); ctx.lineTo(-5, -5); ctx.moveTo(-12, 0); ctx.lineTo(-6, 0); ctx.moveTo(-11, 5); ctx.lineTo(-5, 5); ctx.stroke(); break;
      case 'crit': ctx.beginPath(); ctx.moveTo(-11, 0); ctx.quadraticCurveTo(0, -10, 11, 0); ctx.quadraticCurveTo(0, 10, -11, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, TAU); ctx.fill(); break;
      case 'hp': ctx.restore(); ctx.save(); ctx.translate(x, y); ctx.scale(s / 20, s / 20); heart(0, 1, 9, '#ff5a5f'); break;
      case 'blood': ctx.fillStyle = '#ff4b4b'; ctx.beginPath(); ctx.moveTo(0, -10); ctx.quadraticCurveTo(9, 2, 0, 9); ctx.quadraticCurveTo(-9, 2, 0, -10); ctx.fill(); break;
      case 'fire': ctx.beginPath(); ctx.moveTo(0, 10); ctx.quadraticCurveTo(-10, 4, -4, -4); ctx.quadraticCurveTo(-2, 0, 0, -11); ctx.quadraticCurveTo(10, -2, 6, 6); ctx.quadraticCurveTo(4, 10, 0, 10); ctx.fill(); ctx.fillStyle = '#ffe17a'; ctx.beginPath(); ctx.arc(0, 4, 3, 0, TAU); ctx.fill(); break;
      case 'ice': for (let i = 0; i < 3; i++) { ctx.save(); ctx.rotate(i * Math.PI / 3); ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, 11); ctx.moveTo(-3, -8); ctx.lineTo(0, -5); ctx.lineTo(3, -8); ctx.moveTo(-3, 8); ctx.lineTo(0, 5); ctx.lineTo(3, 8); ctx.stroke(); ctx.restore(); } break;
      case 'orbit': ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.lineWidth = 1.2; ctx.stroke(); ctx.beginPath(); ctx.arc(9, 0, 3.4, 0, TAU); ctx.arc(-4.5, 7.8, 3.4, 0, TAU); ctx.arc(-4.5, -7.8, 3.4, 0, TAU); ctx.fill(); break;
      case 'eagle': ctx.beginPath(); ctx.moveTo(-12, -4); ctx.quadraticCurveTo(-6, -8, 0, -1); ctx.quadraticCurveTo(6, -8, 12, -4); ctx.quadraticCurveTo(6, 0, 1, 6); ctx.lineTo(-1, 6); ctx.quadraticCurveTo(-6, 0, -12, -4); ctx.fill(); break;
      case 'speed': ctx.beginPath(); ctx.moveTo(-10, 6); ctx.quadraticCurveTo(-2, -12, 12, -8); ctx.quadraticCurveTo(4, -6, 8, -2); ctx.quadraticCurveTo(0, -2, 4, 3); ctx.quadraticCurveTo(-4, 3, -10, 6); ctx.fill(); break;
    }
    ctx.restore();
  }

  function drawHud() {
    // top bar
    ctx.fillStyle = 'rgba(7,30,38,0.85)'; ctx.fillRect(0, 0, W, 66);
    ornamentBand(ctx, 0, 62, W, 10, C.red, C.gold);
    // level + xp
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(28, 22, 17, 0, TAU); ctx.fill();
    ctx.fillStyle = C.blue; ctx.beginPath(); ctx.arc(28, 22, 14, 0, TAU); ctx.fill();
    txt(String(run.level), 28, 23, 15, '#fff', { stroke: C.ink, lw: 3, weight: 900 });
    const bx = 50, bw = 250;
    rr(ctx, bx, 15, bw, 14, 7); ctx.fillStyle = C.ink; ctx.fill();
    const frac = clamp(run.xp / xpNeed(run.level), 0, 1);
    if (frac > 0) { rr(ctx, bx + 2, 17, Math.max(10, (bw - 4) * frac), 10, 5); ctx.fillStyle = '#3fd0e8'; ctx.fill(); }
    // coins & room
    ctx.fillStyle = C.gold; ctx.strokeStyle = C.goldDk; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(20, 49, 7, 0, TAU); ctx.fill(); ctx.stroke();
    txt('₸', 20, 49.5, 9, C.goldDk, { weight: 900 });
    txt(String(run.coins), 32, 49, 14, '#fff', { align: 'left', weight: 700 });
    txt(`БӨЛМЕ ${run.room}/${TOTAL_ROOMS}`, W / 2, 48, 15, C.gold, { weight: 900, stroke: C.ink, lw: 3 });
    // pause
    rr(ctx, W - 46, 8, 36, 36, 9); ctx.fillStyle = C.ink; ctx.fill();
    rr(ctx, W - 43, 11, 30, 30, 7); ctx.fillStyle = C.blueDk; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(W - 34, 18, 4, 16); ctx.fillRect(W - 26, 18, 4, 16);
    ui.push({ x: W - 50, y: 4, w: 46, h: 46, fn: () => { if (scene === 'play' && !modal) { modal = 'pause'; Sound.click(); } } });
    // boss bar
    const boss = enemies.find(e => e.boss && e.spawn <= 0);
    if (boss) {
      const x = 40, w = W - 80, y = ARENA.y + 10;
      rr(ctx, x, y, w, 12, 6); ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fill();
      rr(ctx, x + 2, y + 2, Math.max(4, (w - 4) * clamp(boss.hp / boss.maxHp, 0, 1)), 8, 4); ctx.fillStyle = '#e23a33'; ctx.fill();
      txt(boss.name, W / 2, y + 22, 12, '#fff', { stroke: C.ink, lw: 3, weight: 900 });
    }
  }

  function drawPlayerBars() {
    const p = player, w = 40, x = p.x - w / 2, y = p.y - 40;
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; rr(ctx, x - 1, y - 1, w + 2, 7, 3); ctx.fill();
    ctx.fillStyle = '#5fd35a'; rr(ctx, x, y, Math.max(3, w * clamp(p.hp / p.maxHp, 0, 1)), 5, 2.5); ctx.fill();
    txt(String(Math.ceil(p.hp)), p.x, y - 8, 11, '#fff', { stroke: C.ink, lw: 3, weight: 900 });
  }

  function drawWorld() {
    if (!bgCache) bgCache = offscreen(g => drawGroundTo(g, run.room));
    ctx.save();
    if (shake > 0) ctx.translate(rand(-1, 1) * shake * 0.35, rand(-1, 1) * shake * 0.35);
    ctx.drawImage(bgCache, 0, 0, W, H);
    drawGate();
    for (const p of pickups) drawPickup(p);
    const list = enemies.map(e => ({ y: e.y, d: () => drawEnemy(e) }));
    if (scene === 'play' || scene === 'victory') list.push({ y: player.y, d: () => {
      if (player.inv > 0 && Math.floor(time * 20) % 2 === 0) ctx.globalAlpha = 0.45;
      drawHero(player.x, player.y, player.face, 1, { moving: player.moving, walk: player.walk, pull: player.atkAnim > 0 ? 1 - player.atkAnim / 0.18 : (player.moving ? 0 : 0.3) });
      ctx.globalAlpha = 1;
    } });
    list.sort((a, b) => a.y - b.y).forEach(o => o.d());
    // orbit charms
    const no = sk('orbit');
    for (let i = 0; i < no; i++) {
      const a = player.orbitA + i * TAU / no, ox = player.x + Math.cos(a) * 44, oy = player.y + Math.sin(a) * 44;
      ctx.fillStyle = 'rgba(200,150,255,0.35)'; ctx.beginPath(); ctx.arc(ox, oy, 10, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(ox, oy); ctx.rotate(a);
      ctx.fillStyle = '#e9d2ff'; ctx.strokeStyle = '#5d2a8a'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(6, 4); ctx.lineTo(-6, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    // eagle
    if (sk('eagle') && scene === 'play') {
      const eg = player.eagle, f = Math.sin(time * 12) * 4;
      ctx.save(); ctx.translate(eg.x, eg.y);
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(0, 26, 8, 3, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#7a4a1e'; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-13, -2 + f); ctx.quadraticCurveTo(-6, -6, 0, 0); ctx.quadraticCurveTo(6, -6, 13, -2 + f); ctx.quadraticCurveTo(6, 2, 2, 7); ctx.lineTo(-2, 7); ctx.quadraticCurveTo(-6, 2, -13, -2 + f); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f4e3b5'; ctx.beginPath(); ctx.arc(0, -1, 2.6, 0, TAU); ctx.fill();
      ctx.fillStyle = C.gold; ctx.beginPath(); ctx.moveTo(0, 0.5); ctx.lineTo(1.4, 2.4); ctx.lineTo(-1.4, 2.4); ctx.fill();
      ctx.restore();
    }
    for (const a of arrows) drawArrow(a);
    for (const b of bullets) drawBullet(b);
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const t of texts) {
      ctx.globalAlpha = clamp(t.life / 0.4, 0, 1);
      txt(t.t, t.x, t.y, t.size, t.col, { stroke: C.ink, lw: 3, weight: 900 });
    }
    ctx.globalAlpha = 1;
    if (scene === 'play') drawPlayerBars();
    ctx.restore();
  }

  function drawJoystick() {
    if (!joy.active || modal || scene !== 'play') return;
    const jx = joy.x - joy.ox, jy = joy.y - joy.oy, l = Math.hypot(jx, jy), m = Math.min(l, 36);
    const kx = joy.ox + (l ? jx / l * m : 0), ky = joy.oy + (l ? jy / l * m : 0);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 40, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(244,196,48,0.85)'; ctx.beginPath(); ctx.arc(kx, ky, 17, 0, TAU); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.stroke();
  }

  function drawBanner() {
    if (!banner) return;
    const a = clamp(banner.t / 0.4, 0, 1) * clamp((2.6 - banner.t) * 4, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(7,30,38,0.7)'; ctx.fillRect(0, 230, W, 76);
    ctx.fillStyle = C.gold; ctx.fillRect(0, 230, W, 2); ctx.fillRect(0, 304, W, 2);
    txt(banner.text, W / 2, 258, 30, banner.col, { stroke: C.ink, lw: 6, weight: 900 });
    txt(banner.sub, W / 2, 288, 14, C.cream, { weight: 700 });
    ctx.restore();
  }

  // ---- modals & scenes
  function overlay(a) { ctx.fillStyle = `rgba(4,16,22,${a})`; ctx.fillRect(0, 0, W, H); }

  function drawLevelUp() {
    overlay(0.72);
    txt('ДЕҢГЕЙ ЖОҒАРЫЛАДЫ!', W / 2, 112, 24, C.gold, { stroke: C.ink, lw: 6, weight: 900 });
    txt('Уровень ' + (run.level - run.pendingLv + 1) + ' — выберите навык', W / 2, 142, 14, C.cream, { weight: 500 });
    choices.forEach((s, i) => {
      const x = 24, y = 170 + i * 128, w = W - 48, h = 112;
      const pulse = 1 + Math.sin(time * 4 + i) * 0.01;
      ctx.save(); ctx.translate(W / 2, y + h / 2); ctx.scale(pulse, pulse); ctx.translate(-W / 2, -(y + h / 2));
      panel(x, y, w, h);
      skillIcon(s.id, x + 50, y + h / 2, 28);
      txt(s.kz, x + 92, y + 34, 19, C.redDk, { align: 'left', weight: 900 });
      wrap(s.ru, x + 92, y + 60, w - 112, 17, 13, C.ink, { align: 'left' });
      const lv = sk(s.id);
      for (let k = 0; k < s.max; k++) {
        ctx.fillStyle = k < lv ? C.gold : 'rgba(42,22,12,0.2)';
        ctx.beginPath(); ctx.arc(x + 98 + k * 12, y + h - 20, 4, 0, TAU); ctx.fill();
      }
      ctx.restore();
      ui.push({ x, y, w, h, fn: () => {
        applySkill(s); Sound.click();
        run.pendingLv--;
        if (run.pendingLv > 0) { choices = rollChoices(); if (!choices.length) { run.pendingLv = 0; modal = null; } }
        else modal = null;
      } });
    });
  }

  function drawKydyrModal() {
    overlay(0.75);
    panel(24, 120, W - 48, 400);
    drawKydyr(W / 2, 220, 2.2);
    txt('ҚЫДЫР АТА', W / 2, 298, 24, C.redDk, { weight: 900 });
    wrap('Старец Кыдыр встречает батыра в степи и предлагает дар', W / 2, 326, W - 100, 17, 13, C.ink);
    button(48, 370, W - 96, 54, 'САУЫҒУ · лечение 40%', () => { healPlayer(player.maxHp * 0.4); Sound.level(); modal = null; kydyrNext && kydyrNext(); }, { col: '#8be07a', col2: '#3d9a36', size: 16 });
    button(48, 438, W - 96, 54, 'БАТА · случайный навык', () => {
      const pool = rollChoices();
      if (pool.length) { applySkill(pool[0]); banner = { text: pool[0].kz, sub: 'Бата: ' + pool[0].ru, t: 2.4, col: C.gold }; }
      Sound.level(); modal = null; kydyrNext && kydyrNext();
    }, { size: 16 });
  }

  function drawPause() {
    overlay(0.7);
    panel(30, 110, W - 60, 430);
    txt('ҮЗІЛІС', W / 2, 150, 26, C.redDk, { weight: 900 });
    txt('Пауза', W / 2, 176, 13, C.ink, { weight: 500 });
    const ids = SKILLS.filter(s => sk(s.id) > 0);
    if (ids.length) {
      ids.forEach((s, i) => {
        const cx = 70 + (i % 6) * 44, cy = 214 + Math.floor(i / 6) * 46;
        skillIcon(s.id, cx, cy, 17);
        if (sk(s.id) > 1) txt('×' + sk(s.id), cx + 14, cy + 14, 11, C.redDk, { weight: 900 });
      });
    } else txt('Навыков пока нет', W / 2, 220, 13, '#7a6a55', { weight: 500 });
    button(60, 318, W - 120, 46, 'ПРОДОЛЖИТЬ', () => { modal = null; Sound.click(); });
    button(60, 374, W - 120, 42, 'Музыка: ' + (Sound.music ? 'вкл' : 'выкл'), () => { Sound.init(); Sound.setMusic(!Sound.music); }, { col: '#5fc8de', col2: '#1d7f99', size: 15 });
    button(60, 424, W - 120, 42, 'Звуки: ' + (Sound.sfx ? 'вкл' : 'выкл'), () => { Sound.init(); Sound.setSfx(!Sound.sfx); }, { col: '#5fc8de', col2: '#1d7f99', size: 15 });
    button(60, 476, W - 120, 42, 'В МЕНЮ', () => { bank += run.coins; store.set('coins', bank); if (run.room > best) { best = run.room; store.set('best', best); } scene = 'menu'; modal = null; Sound.click(); }, { col: '#ff8a6a', col2: '#c2402a', size: 15 });
  }

  function drawEnd() {
    const won = scene === 'victory';
    overlay(clamp(endT * 1.5, 0, 0.75));
    if (endT < 0.5) return;
    panel(30, 130, W - 60, 380);
    if (won) {
      txt('ЖЕҢІС!', W / 2, 180, 40, C.gold, { stroke: C.ink, lw: 7, weight: 900 });
      txt('Победа! Степь свободна от чудищ', W / 2, 214, 13, C.ink, { weight: 500 });
    } else {
      txt('БАТЫР ҚҰЛАДЫ', W / 2, 180, 28, C.redDk, { weight: 900 });
      txt('Вы погибли', W / 2, 210, 13, C.ink, { weight: 500 });
    }
    const rows = [['Комната', (won ? TOTAL_ROOMS : run.room) + ' / ' + TOTAL_ROOMS], ['Уровень', String(run.level)], ['Убито врагов', String(run.kills)], ['Монеты', '+' + run.coins + ' ₸'], ['Рекорд', 'комната ' + best]];
    rows.forEach(([k, v], i) => {
      txt(k, 60, 250 + i * 30, 15, '#6a5a45', { align: 'left', weight: 500 });
      txt(v, W - 60, 250 + i * 30, 16, C.ink, { align: 'right', weight: 900 });
    });
    button(54, 410, W - 108, 48, 'ЕЩЁ РАЗ', () => { Sound.click(); newRun(); });
    button(54, 464, W - 108, 36, 'В меню', () => { Sound.click(); scene = 'menu'; }, { col: '#5fc8de', col2: '#1d7f99', size: 14 });
  }

  function drawMenu() {
    if (!menuBg) menuBg = offscreen(drawMenuBgTo);
    ctx.drawImage(menuBg, 0, 0, W, H);
    const wob = Math.sin(time * 1.5) * 2;
    txt('МЕРГЕН', W / 2, 92 + wob, 58, C.gold, { stroke: C.ink, lw: 10, weight: 900 });
    koshkar(ctx, W / 2, 136, 30, C.red, 3.5);
    txt('ДАЛА БАТЫРЫ', W / 2, 160, 16, C.cream, { stroke: C.ink, lw: 4, weight: 900 });
    drawHero(W / 2, 300, Math.sin(time) * 0.4 - Math.PI / 2 + 0.9, 2.7, { pull: 0.5 + Math.sin(time * 2) * 0.3 });
    button(W / 2 - 100, 368, 200, 56, 'ОЙНАУ', () => { Sound.init(); Sound.click(); newRun(); }, { size: 24 });
    txt('Играть', W / 2, 438, 12, '#fff', { stroke: C.ink, lw: 3, weight: 700 });
    // upgrades
    panel(24, 452, W - 48, 150);
    ctx.fillStyle = C.gold; ctx.strokeStyle = C.goldDk; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(W / 2 - 34, 478, 8, 0, TAU); ctx.fill(); ctx.stroke();
    txt('₸', W / 2 - 34, 478.5, 10, C.goldDk, { weight: 900 });
    txt(String(bank), W / 2 - 20, 478, 17, C.ink, { align: 'left', weight: 900 });
    const rowsU = [
      ['Күш', 'Атака +8%', upAtk, () => { const c = upCost(upAtk); if (bank >= c && upAtk < 10) { bank -= c; upAtk++; store.set('coins', bank); store.set('upAtk', upAtk); Sound.level(); } }],
      ['Денсаулық', 'Здоровье +10%', upHp, () => { const c = upCost(upHp); if (bank >= c && upHp < 10) { bank -= c; upHp++; store.set('coins', bank); store.set('upHp', upHp); Sound.level(); } }],
    ];
    rowsU.forEach(([kz, ru, lv, fn], i) => {
      const y = 502 + i * 46;
      txt(kz + ' · ур. ' + lv, 44, y, 15, C.redDk, { align: 'left', weight: 900 });
      txt(ru, 44, y + 17, 11, '#6a5a45', { align: 'left', weight: 500 });
      const c = upCost(lv), maxed = lv >= 10;
      button(W - 142, y - 14, 104, 36, maxed ? 'МАКС' : c + ' ₸', fn, { disabled: maxed || bank < c, size: 15, col: '#8be07a', col2: '#3d9a36' });
    });
    txt('Рекорд: комната ' + best + ' / ' + TOTAL_ROOMS, W / 2, 618, 12, C.cream, { stroke: C.ink, lw: 3, weight: 700 });
    // sound toggles
    const tg = (x, on, label, fn) => {
      rr(ctx, x, 24, 40, 34, 9); ctx.fillStyle = C.ink; ctx.fill();
      rr(ctx, x + 3, 27, 34, 28, 7); ctx.fillStyle = on ? C.blueDk : '#5a3a30'; ctx.fill();
      txt(label, x + 20, 41.5, 15, on ? '#fff' : '#a88', { weight: 900 });
      ui.push({ x, y: 22, w: 40, h: 38, fn });
    };
    tg(W - 96, Sound.music, '♪', () => { Sound.init(); Sound.setMusic(!Sound.music); });
    tg(W - 52, Sound.sfx, '♫', () => { Sound.init(); Sound.setSfx(!Sound.sfx); });
  }

  // =================================================================== render
  function render() {
    ui = [];
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.fillStyle = C.teal; ctx.fillRect(0, 0, W, H);
    if (scene === 'menu') drawMenu();
    else {
      drawWorld();
      drawHud();
      drawJoystick();
      drawBanner();
      if (scene === 'play') {
        if (modal === 'levelup') drawLevelUp();
        else if (modal === 'kydyr') drawKydyrModal();
        else if (modal === 'pause') drawPause();
      } else drawEnd();
      if (scene !== 'play') ui = ui.filter(u => u.y > 100 || scene === 'menu');
    }
    if (fade > 0) { ctx.fillStyle = `rgba(4,16,22,${fade})`; ctx.fillRect(0, 0, W, H); }
  }

  // =================================================================== input
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    canvas.focus({ preventScroll: true });
    Sound.init();
    const p = toLogical(e);
    for (let i = ui.length - 1; i >= 0; i--) {
      const b = ui[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { if (b.fn) b.fn(); return; }
    }
    if (scene === 'play' && !modal) {
      joy.active = true; joy.id = e.pointerId; joy.ox = joy.x = p.x; joy.oy = joy.y = p.y;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
  });
  canvas.addEventListener('pointermove', e => { if (joy.active && e.pointerId === joy.id) { const p = toLogical(e); joy.x = p.x; joy.y = p.y; } });
  const endJoy = e => { if (e.pointerId === joy.id) { joy.active = false; joy.id = null; } };
  canvas.addEventListener('pointerup', endJoy);
  canvas.addEventListener('pointercancel', endJoy);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    keys.add(e.code);
    Sound.init();
    if ((e.code === 'Escape' || e.code === 'KeyP') && scene === 'play') { modal = modal === 'pause' ? null : (modal || 'pause'); }
    if (e.code === 'Enter' || e.code === 'Space') {
      if (scene === 'menu') newRun();
      else if ((scene === 'dead' || scene === 'victory') && endT > 0.8) newRun();
      else if (modal === 'levelup' && choices[0]) { /* choose with 1/2/3 */ }
    }
    if (modal === 'levelup' && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) {
      const i = +e.code.slice(-1) - 1;
      const target = ui.filter(u => u.w === W - 48 && u.h === 112)[i];
      if (target) target.fn();
    }
  });
  window.addEventListener('keyup', e => keys.delete(e.code));
  window.addEventListener('blur', () => { keys.clear(); joy.active = false; if (scene === 'play' && !modal) modal = 'pause'; });

  // =================================================================== loop
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now - last, 100); last = now;
    while (acc >= DT * 1000) { update(DT); acc -= DT * 1000; }
    render();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });
  if (document.fonts && document.fonts.load) document.fonts.load(`900 20px "Rubik"`).catch(() => {});
  requestAnimationFrame(frame);

  // hooks for automated tests (room jumping only in #test mode)
  window.Mergen = {
    goto(n) { if (!TEST_MODE) return; if (scene !== 'play') newRun(); run.room = n; buildRoom(n); },
    get scene() { return scene; }, get modal() { return modal; },
    get room() { return run && run.room; }, get level() { return run && run.level; },
    get enemies() { return enemies.length; }, get roomClear() { return roomClear; }, get gateOpen() { return gateOpen; },
    get player() { return player && { x: player.x, y: player.y, hp: player.hp, maxHp: player.maxHp }; },
    get skills() { return run && Object.assign({}, run.sk); },
    get threats() {
      return {
        bullets: bullets.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy })),
        enemies: enemies.filter(e => e.spawn <= 0).map(e => ({ x: e.x, y: e.y, r: e.r, boss: e.boss })),
      };
    },
  };
})();
</script>
</body>
