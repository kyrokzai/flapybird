<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Trump</title>
<meta name="description" content="Flappy Trump — браузерная аркада: тапай, чтобы лететь, и пролетай между стенами.">
<meta name="theme-color" content="#10142a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10142a;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #22294d 0%, #10142a 70%);
  }
  canvas {
    display: block;
    cursor: pointer;
    box-shadow: 0 0 48px rgba(0, 0, 0, .55);
    outline: none;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Flappy Trump"></canvas>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- constants
  const W = 288, H = 512;
  const GROUND_H = 92, GROUND_Y = H - GROUND_H;
  const STEP_MS = 1000 / 60;

  const GRAVITY = 0.25;
  const FLAP_V = -4.7;
  const MAX_FALL = 9;
  const SPEED = 2;

  const WALL_W = 52, CAP_H = 16, CAP_OVER = 4;
  const GAP = 102, SPACING = 168;
  const GAP_MIN = 60, GAP_MAX = GROUND_Y - GAP - 60;

  const BIRD_X = 78, READY_Y = 236;
  // hero: drawn at HERO_S scale; hitbox = head circle + suit circle (local coords, before scaling)
  const HERO_S = 0.85, MAX_DIVE = 1.25;
  const HIT = [{ x: 0, y: -6, r: 14 }, { x: 0, y: 15, r: 10 }];

  const FAR_W = 576, NEAR_W = 432, LAYER_TOP = GROUND_Y - 270, LAYER_H = 270;

  const FONT = '"Luckiest Guy", "Arial Black", Impact, sans-serif';
  const INK = '#3a1c08';

  const MEDALS = [
    { min: 40, name: 'platinum', c: ['#f6fdff', '#cfe9f4', '#6f97aa'] },
    { min: 30, name: 'gold',     c: ['#fff0a0', '#f2b632', '#94620b'] },
    { min: 20, name: 'silver',   c: ['#f4f6f9', '#b9c1cb', '#6e7884'] },
    { min: 10, name: 'bronze',   c: ['#f0b47c', '#b8743d', '#70421c'] },
  ];

  const HYPE = ['TREMENDOUS!', 'HUGE!', 'BIGLY!', 'WINNING!', 'THE BEST!', 'INCREDIBLE!'];

  const PALETTES = {
    day: {
      skyTop: '#7f9cb5', skyBot: '#e3d1b2',
      orb: '#fff1d2', orbGlow: 'rgba(255,215,160,0.35)',
      mountBack: '#a3a9b2', mount: '#7f8996', haze: 'rgba(222,203,172,0.6)',
      farCity: '#b2a58f', farWin: '#8b7f6c', crane: '#8a7c66',
      plume: ['#e2d8c8', '#c7bba8', '#a19685', '#756c61'],
      bld: ['#cfba96', '#c1aa85', '#dac9a5', '#b79f7b'],
      slab: 'rgba(255,248,230,0.35)', win: '#4b4037', lit: '#4b4037', interior: '#3d342c',
      burn: 'rgba(35,25,18,0.6)', ink: 'rgba(60,45,30,0.65)',
      rubble: ['#b8a990', '#9f927d', '#cdbfa6', '#8b806f'], rubbleInk: '#544a3e',
      smoke: [112, 106, 100], smokeA: 0.5, fireGlow: 0.25, stars: false,
    },
    night: {
      skyTop: '#0d0a15', skyBot: '#62301e',
      orb: '#ece4c6', orbGlow: 'rgba(255,190,140,0.16)',
      mountBack: '#3a2e38', mount: '#2a2230', haze: 'rgba(130,55,25,0.38)',
      farCity: '#2f2420', farWin: '#ff8a3a', crane: '#241b18',
      plume: ['#6a5248', '#4e3e38', '#3a2e2a', '#251d1b'],
      bld: ['#4f4237', '#45392f', '#594b3e', '#3f352c'],
      slab: 'rgba(255,170,100,0.12)', win: '#18120e', lit: '#ff9b3d', interior: '#120d0a',
      burn: 'rgba(0,0,0,0.55)', ink: 'rgba(10,6,4,0.7)',
      rubble: ['#5c5045', '#4b4139', '#685b4d', '#40372f'], rubbleInk: '#1c1612',
      smoke: [44, 34, 31], smokeA: 0.6, fireGlow: 0.55, stars: true,
    },
  };

  // ---------------------------------------------------------------- helpers
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
  };

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hash3 = (a, b, c) => {
    let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  const GROUND_COLS = ['#b3a58e', '#8a7e6c', '#a3967f', '#c2b59d'];
  const GROUND_CHUNKS = (() => {
    const r = mulberry32(12), out = [];
    for (let i = 0; i < 9; i++) out.push([4 + r() * 40, 6 + r() * 52, 3 + r() * 5, r() * 3, Math.floor(r() * 4)]);
    return out;
  })();

  // ---------------------------------------------------------------- canvas
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let K = 1;
  let layerCache = {};

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / W, vh / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    K = scale * dpr;
    canvas.width = Math.round(W * K);
    canvas.height = Math.round(H * K);
    K = canvas.width / W;
    layerCache = {};
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------- sound
  const Sound = {
    ac: null, noise: null,
    muted: store.get('flappyTrump.muted', '0') === '1',
    init() {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try { this.ac = new AC(); } catch (e) { return; }
        const len = Math.floor(this.ac.sampleRate * 0.6);
        const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noise = buf;
      }
      if (this.ac.state === 'suspended') this.ac.resume();
    },
    ok() { return this.ac && !this.muted; },
    tone(type, f0, f1, t0, dur, vol) {
      const ac = this.ac, t = ac.currentTime + t0;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.03);
    },
    hiss(f0, f1, t0, dur, vol, q) {
      const ac = this.ac, t = ac.currentTime + t0;
      const s = ac.createBufferSource(); s.buffer = this.noise;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
      f.frequency.setValueAtTime(f0, t);
      f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0008, t);
      g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      s.connect(f); f.connect(g); g.connect(ac.destination);
      s.start(t); s.stop(t + dur + 0.03);
    },
    flap()   { if (this.ok()) this.hiss(650, 2600, 0, 0.11, 0.45, 1.4); },
    point()  { if (this.ok()) { this.tone('square', 988, 988, 0, 0.09, 0.07); this.tone('square', 1319, 1319, 0.08, 0.25, 0.07); } },
    hit()    { if (this.ok()) { this.tone('square', 240, 50, 0, 0.2, 0.2); this.hiss(1800, 250, 0, 0.16, 0.5, 0.7); } },
    die()    { if (this.ok()) this.tone('triangle', 760, 110, 0.28, 0.55, 0.28); },
    swoosh() { if (this.ok()) this.hiss(300, 1900, 0, 0.32, 0.22, 0.9); },
    medal()  { if (this.ok()) [784, 988, 1175, 1568].forEach((f, i) => this.tone('square', f, f, i * 0.07, 0.18, 0.05)); },
  };

  // ---------------------------------------------------------------- game state
  let state = 'title';           // title | ready | play | dying | over
  let tick = 0, overT = 0, medalT = 0;
  let score = 0, displayScore = 0;
  let best = parseInt(store.get('flappyTrump.best', '0'), 10) || 0;
  let newBest = false, medal = null;
  let palName = 'day';
  let walls = [], popups = [];
  let groundOff = 0, farOff = 0, nearOff = 0;
  let flash = 0, shake = 0, fade = 0, fadeTarget = null;
  const bird = { x: W / 2, y: 228, vel: 0, rot: 0, wing: 0, tie: 0 };

  const stars = (() => {
    const r = mulberry32(99), out = [];
    for (let i = 0; i < 55; i++) out.push([r() * W, r() * (GROUND_Y - 170), r() < 0.2 ? 1.6 : 1, r() * 6.28]);
    return out;
  })();

  const BTN = {
    titlePlay: { x: W / 2 - 62, y: 318, w: 124, h: 46, label: 'PLAY' },
    overPlay:  { x: W / 2 - 112, y: 352, w: 102, h: 42, label: 'PLAY' },
    overMenu:  { x: W / 2 + 10,  y: 352, w: 102, h: 42, label: 'MENU' },
    mute:      { x: W - 40, y: 10, w: 30, h: 30 },
  };
  function heroCircles() {
    const c = Math.cos(bird.rot), sn = Math.sin(bird.rot);
    return HIT.map(h => ({ x: bird.x + (h.x * c - h.y * sn) * HERO_S, y: bird.y + (h.x * sn + h.y * c) * HERO_S, r: h.r * HERO_S }));
  }
  const heroBottom = () => Math.max(...heroCircles().map(c => c.y + c.r));

  const inBtn = (p, b) => p && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

  function goTitle() {
    state = 'title';
    palName = 'day';
    walls = []; popups = []; smoke = [];
    bird.x = W / 2; bird.vel = 0; bird.rot = 0;
    Sound.swoosh();
  }

  function goReady() {
    state = 'ready';
    palName = Math.random() < 0.5 ? 'day' : 'night';
    walls = []; popups = []; smoke = [];
    score = 0; displayScore = 0; newBest = false; medal = null;
    bird.x = BIRD_X; bird.y = READY_Y; bird.vel = 0; bird.rot = 0;
    Sound.swoosh();
  }

  function startPlay() {
    state = 'play';
    walls.push(makeWall(W + 40));
  }

  function makeWall(x) {
    return { x, top: Math.round(GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN)), passed: false, seed: (Math.random() * 1e6) | 0 };
  }

  function flap() {
    bird.vel = FLAP_V;
    Sound.flap();
  }

  function crash(onGround) {
    flash = 0.9; shake = 12;
    Sound.hit();
    if (onGround) {
      endGame();
    } else {
      state = 'dying';
      bird.vel = Math.max(bird.vel, 0.5);
      Sound.die();
    }
  }

  function endGame() {
    state = 'over';
    overT = 0; medalT = 0;
    displayScore = 0;
    newBest = score > best;
    if (newBest) { best = score; store.set('flappyTrump.best', String(best)); }
    medal = MEDALS.find(m => score >= m.min) || null;
  }

  // ---------------------------------------------------------------- input
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }

  function toggleMute() {
    Sound.muted = !Sound.muted;
    store.set('flappyTrump.muted', Sound.muted ? '1' : '0');
  }

  function press(p) {
    Sound.init();
    switch (state) {
      case 'title':
        if (inBtn(p, BTN.mute)) { toggleMute(); return; }
        goReady();
        break;
      case 'ready':
        startPlay(); flap();
        break;
      case 'play':
        flap();
        break;
      case 'over':
        if (overT < 50) return;
        if (inBtn(p, BTN.mute)) { toggleMute(); return; }
        if (!p || inBtn(p, BTN.overPlay)) goReady();
        else if (inBtn(p, BTN.overMenu)) goTitle();
        break;
    }
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    canvas.focus({ preventScroll: true });
    press(toLogical(e));
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    const k = e.code;
    if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'Enter') {
      e.preventDefault();
      if (!e.repeat) press(null);
    } else if (k === 'KeyM') {
      toggleMute();
    }
  });

  // ---------------------------------------------------------------- update
  function update() {
    tick++;
    if (flash > 0) flash = Math.max(0, flash - 0.06);
    if (shake > 0) shake--;

    const scrolling = state === 'title' || state === 'ready' || state === 'play';
    if (scrolling) {
      groundOff = (groundOff + SPEED) % 48;
      farOff = (farOff + SPEED * 0.12) % FAR_W;
      nearOff = (nearOff + SPEED * 0.35) % NEAR_W;
    }
    if (state !== 'dying' && state !== 'over') bird.wing += state === 'play' ? 0.5 : 0.3;

    switch (state) {
      case 'title':
        bird.y = 226 + Math.sin(tick * 0.08) * 6;
        bird.rot = 0;
        break;
      case 'ready':
        bird.y = READY_Y + Math.sin(tick * 0.08) * 5;
        bird.rot = 0;
        break;
      case 'play':
        updatePlay();
        break;
      case 'dying':
        bird.vel = Math.min(bird.vel + GRAVITY * 1.2, MAX_FALL + 2);
        bird.y += bird.vel;
        bird.rot = Math.min(bird.rot + 0.14, MAX_DIVE);
        { const over = heroBottom() - GROUND_Y; if (over >= 0) { bird.y -= over; endGame(); } }
        break;
      case 'over':
        overT++;
        if (overT === 20) Sound.swoosh();
        if (overT > 50 && displayScore < score && overT % 2 === 0) {
          displayScore = Math.min(score, displayScore + Math.max(1, Math.ceil(score / 40)));
        }
        if (overT > 50 && displayScore >= score) {
          if (medalT === 0 && medal) Sound.medal();
          medalT++;
        }
        break;
    }

    updateSmoke(scrolling);

    const tieTarget = clamp(-bird.vel * 0.07, -0.5, 0.5);
    bird.tie += (tieTarget - bird.tie) * 0.2;

    for (const p of popups) { p.life--; p.y -= 0.6; }
    popups = popups.filter(p => p.life > 0);
  }

  function updatePlay() {
    bird.vel = Math.min(bird.vel + GRAVITY, MAX_FALL);
    bird.y += bird.vel;
    if (bird.y < -24) { bird.y = -24; bird.vel = 0; }
    if (bird.vel < 1.8) bird.rot += (-0.42 - bird.rot) * 0.35;
    else bird.rot = Math.min(bird.rot + 0.06, MAX_DIVE);

    for (const w of walls) {
      w.x -= SPEED;
      if (!w.passed && w.x + WALL_W / 2 < bird.x) {
        w.passed = true;
        score++;
        Sound.point();
        if (score % 10 === 0) popups.push({ text: HYPE[(score / 10 - 1) % HYPE.length], y: 112, life: 70 });
      }
    }
    const last = walls[walls.length - 1];
    if (last && last.x + SPACING <= W + 60) walls.push(makeWall(last.x + SPACING));
    walls = walls.filter(w => w.x > -WALL_W - 12);

    const below = heroBottom() - GROUND_Y;
    if (below >= 0) { bird.y -= below; crash(true); return; }

    const circles = heroCircles();
    for (const w of walls) {
      const gb = w.top + GAP;
      for (const c of circles) {
        if (circleRect(c.x, c.y, c.r, w.x, -1000, WALL_W, w.top - CAP_H + 1000) ||
            circleRect(c.x, c.y, c.r, w.x - CAP_OVER, w.top - CAP_H, WALL_W + CAP_OVER * 2, CAP_H) ||
            circleRect(c.x, c.y, c.r, w.x - CAP_OVER, gb, WALL_W + CAP_OVER * 2, CAP_H) ||
            circleRect(c.x, c.y, c.r, w.x, gb + CAP_H, WALL_W, GROUND_Y - gb - CAP_H)) {
          crash(false);
          return;
        }
      }
    }
  }

  // ---------------------------------------------------------------- background layers
  function makeLayer(w, draw) {
    const c = document.createElement('canvas');
    c.width = Math.round(w * K);
    c.height = Math.round(LAYER_H * K);
    const g = c.getContext('2d');
    g.setTransform(K, 0, 0, K, 0, -LAYER_TOP * K);
    draw(g, w);
    return c;
  }

  function getLayers(name) {
    if (!layerCache[name]) {
      const pal = PALETTES[name];
      layerCache[name] = {
        far: makeLayer(FAR_W, (g, w) => drawFarLayer(g, w, pal)),
        near: makeLayer(NEAR_W, (g, w) => drawNearLayer(g, w, pal)),
      };
    }
    return layerCache[name];
  }

  // ---- ruined city: deterministic data shared by the layer renderer and the smoke/fire system
  const NEAR_BLD = (() => {
    const r = mulberry32(31), out = [];
    let x = 0;
    while (x < NEAR_W - 18) {
      const bw = 26 + Math.floor(r() * 26);
      out.push({
        x, w: Math.min(bw, NEAR_W - x), h: 40 + Math.floor(r() * 70),
        col: Math.floor(r() * 4), dmg: r(), seed: Math.floor(r() * 1e6),
      });
      x += bw + (r() < 0.35 ? 8 + r() * 16 : 0);
    }
    return out;
  })();
  const FIRE_SRC = NEAR_BLD.filter(b => b.dmg > 0.55).map(b => ({ x: b.x + b.w * 0.5, y: GROUND_Y - b.h * 0.8 }));

  function ridge(x, w, base, waves) {
    let y = base;
    for (const [a, f, p] of waves) y -= a * Math.sin(2 * Math.PI * f * x / w + p);
    return y;
  }

  function drawFarLayer(g, w, pal) {
    const r = mulberry32(7);
    // mountains (seamless: every wave has an integer number of periods per tile)
    const mountain = (base, waves, color) => {
      g.fillStyle = color;
      g.beginPath(); g.moveTo(0, GROUND_Y);
      for (let x = 0; x <= w; x += 3) g.lineTo(x, ridge(x, w, base, waves));
      g.lineTo(w, GROUND_Y); g.closePath(); g.fill();
    };
    mountain(205, [[20, 2, 0.4], [10, 5, 1.9], [4, 11, 0.7]], pal.mountBack);
    mountain(236, [[22, 1, 2.2], [12, 3, 0.3], [5, 9, 1.1], [2, 17, 0.5]], pal.mount);
    let hz = g.createLinearGradient(0, 190, 0, GROUND_Y);
    hz.addColorStop(0, 'rgba(0,0,0,0)'); hz.addColorStop(1, pal.haze);
    g.fillStyle = hz; g.fillRect(0, 150, w, GROUND_Y - 150);

    // big smoke column
    const puffs = [];
    for (let i = 0; i < 52; i++) {
      const t = i / 51;
      const spread = t > 0.78 ? (r() - 0.5) * 70 * (t - 0.6) * 2.5 : (r() - 0.5) * 10;
      puffs.push([330 + Math.sin(t * 6) * 5 + t * 10 + spread, GROUND_Y - 30 - t * 215 + (r() - 0.5) * 8, 9 + t * 22 + r() * 7]);
    }
    const passes = [[pal.plume[3], 4, 3, 1], [pal.plume[2], 2, 1, 1], [pal.plume[1], 0, 0, 0.92], [pal.plume[0], -3, -4, 0.62]];
    for (const [c, dx, dy, k] of passes) {
      g.fillStyle = c; g.beginPath();
      for (const [px, py, pr] of puffs) { g.moveTo(px + dx + pr * k, py + dy); g.arc(px + dx, py + dy, pr * k, 0, Math.PI * 2); }
      g.fill();
    }

    // far city silhouette with broken roofs
    g.fillStyle = pal.farCity;
    let x = 0;
    const wins = [];
    while (x < w) {
      const bw = 9 + r() * 20, bh = 16 + r() * 38 + (r() < 0.12 ? 25 : 0);
      const ww = Math.min(bw, w - x), top = GROUND_Y - bh;
      g.beginPath(); g.moveTo(x, GROUND_Y);
      if (r() < 0.5) { g.lineTo(x, top + r() * 8); g.lineTo(x + ww * 0.4, top + r() * 12); g.lineTo(x + ww * 0.7, top + r() * 6); g.lineTo(x + ww, top + r() * 10); }
      else { g.lineTo(x, top); g.lineTo(x + ww, top); }
      g.lineTo(x + ww, GROUND_Y); g.closePath(); g.fill();
      for (let wy = top + 12; wy < GROUND_Y - 4; wy += 6) for (let wx = x + 2; wx < x + ww - 3; wx += 5) if (r() < (pal.stars ? 0.12 : 0.5)) wins.push([wx, wy]);
      x += bw;
    }
    g.fillStyle = pal.farWin;
    for (const [wx, wy] of wins) g.fillRect(wx, wy, 2, 2.5);

    // construction crane
    g.strokeStyle = pal.crane; g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(120, GROUND_Y); g.lineTo(120, GROUND_Y - 108);
    g.moveTo(126, GROUND_Y); g.lineTo(126, GROUND_Y - 108);
    for (let y = GROUND_Y; y > GROUND_Y - 108; y -= 8) { g.moveTo(120, y); g.lineTo(126, y - 8); }
    g.moveTo(96, GROUND_Y - 108); g.lineTo(178, GROUND_Y - 108);
    g.moveTo(96, GROUND_Y - 104); g.lineTo(178, GROUND_Y - 104);
    g.moveTo(123, GROUND_Y - 122); g.lineTo(96, GROUND_Y - 108); g.moveTo(123, GROUND_Y - 122); g.lineTo(178, GROUND_Y - 108);
    g.moveTo(123, GROUND_Y - 108); g.lineTo(123, GROUND_Y - 122);
    g.moveTo(166, GROUND_Y - 104); g.lineTo(166, GROUND_Y - 80);
    g.stroke();

    hz = g.createLinearGradient(0, GROUND_Y - 70, 0, GROUND_Y);
    hz.addColorStop(0, 'rgba(0,0,0,0)'); hz.addColorStop(1, pal.haze);
    g.fillStyle = hz; g.fillRect(0, GROUND_Y - 70, w, 70);
  }

  function drawRuin(g, b, pal) {
    const r = mulberry32(b.seed);
    const x = b.x, w = b.w, top = GROUND_Y - b.h;
    const p = new Path2D();
    p.moveTo(x, GROUND_Y);
    if (b.dmg > 0.35) {
      const n = 4 + Math.floor(r() * 3);
      p.lineTo(x, top + r() * b.h * 0.25);
      for (let i = 1; i < n; i++) p.lineTo(x + w * i / n + (r() - 0.5) * 4, top + r() * b.h * 0.35);
      p.lineTo(x + w, top + r() * b.h * 0.3);
    } else {
      p.lineTo(x, top); p.lineTo(x + w, top);
    }
    p.lineTo(x + w, GROUND_Y); p.closePath();

    g.save();
    g.fillStyle = pal.bld[b.col]; g.fill(p);
    g.clip(p);
    for (let fy = top + 4; fy < GROUND_Y; fy += 10) {
      g.fillStyle = pal.slab; g.fillRect(x, fy, w, 1.5);
      for (let wx = x + 3; wx < x + w - 5; wx += 7) {
        if (r() < 0.1) continue;
        g.fillStyle = pal.stars && r() < 0.16 ? pal.lit : pal.win;
        g.fillRect(wx, fy + 3, 4, 5);
      }
    }
    if (b.dmg > 0.6) {
      // blown-out section with exposed floors
      const hx = x + w * (0.1 + r() * 0.3), hw = w * (0.4 + r() * 0.3);
      const hy = top + b.h * (0.05 + r() * 0.25), hh = b.h * (0.25 + r() * 0.3);
      g.fillStyle = pal.interior;
      g.beginPath();
      g.moveTo(hx, hy + r() * 5); g.lineTo(hx + hw * 0.3, hy - r() * 5); g.lineTo(hx + hw * 0.7, hy + r() * 6);
      g.lineTo(hx + hw, hy); g.lineTo(hx + hw + r() * 4, hy + hh * 0.5); g.lineTo(hx + hw, hy + hh);
      g.lineTo(hx + hw * 0.5, hy + hh + r() * 6); g.lineTo(hx, hy + hh); g.lineTo(hx - r() * 4, hy + hh * 0.5);
      g.closePath(); g.fill();
      g.fillStyle = pal.bld[(b.col + 1) % 4];
      for (let fy = top + 4; fy < GROUND_Y; fy += 10) {
        if (fy > hy - 2 && fy < hy + hh) {
          const sag = (r() - 0.5) * 3;
          g.beginPath(); g.moveTo(hx - 2, fy); g.lineTo(hx + hw + 2, fy + sag); g.lineTo(hx + hw + 2, fy + sag + 2.2); g.lineTo(hx - 2, fy + 2.2); g.fill();
        }
      }
      g.strokeStyle = pal.ink; g.lineWidth = 0.7;
      g.beginPath();
      for (let i = 0; i < 4; i++) { const sx = hx + r() * hw, sy = hy + r() * hh; g.moveTo(sx, sy); g.lineTo(sx + (r() - 0.5) * 4, sy + 4 + r() * 5); }
      g.stroke();
    }
    if (b.dmg > 0.45) {
      const bx = x + w * (0.2 + r() * 0.6), by = top + b.h * (0.3 + r() * 0.4);
      const gr = g.createLinearGradient(0, by, 0, by - 36);
      gr.addColorStop(0, pal.burn); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(bx - 7, by - 36, 14, 38);
    }
    g.fillStyle = 'rgba(0,0,0,0.15)';
    g.fillRect(x + w * 0.72, top - 40, w * 0.28 + 1, b.h + 40);
    g.restore();
    g.strokeStyle = pal.ink; g.lineWidth = 1;
    g.stroke(p);
  }

  function drawRubble(g, w, pal) {
    const r = mulberry32(55);
    g.fillStyle = pal.rubble[1];
    g.fillRect(0, GROUND_Y - 5, w, 5);
    const mounds = [];
    for (let i = 0; i < 9; i++) mounds.push([r() * w, 24 + r() * 40, 7 + r() * 15, Math.floor(r() * 1e6)]);
    for (const [cx, mw, mh, seed] of mounds) {
      for (const ox of [-w, 0, w]) {
        const mx = cx + ox;
        if (mx + mw < 0 || mx - mw > w) continue;
        const rr = mulberry32(seed);
        g.fillStyle = pal.rubble[3];
        g.beginPath(); g.moveTo(mx - mw / 2, GROUND_Y); g.quadraticCurveTo(mx, GROUND_Y - mh * 1.6, mx + mw / 2, GROUND_Y); g.fill();
        // rebar
        g.strokeStyle = pal.rubbleInk; g.lineWidth = 0.8; g.beginPath();
        for (let k = 0; k < 3; k++) { const bx = mx + (rr() - 0.5) * mw * 0.6; g.moveTo(bx, GROUND_Y - mh * 0.5); g.lineTo(bx + (rr() - 0.5) * 10, GROUND_Y - mh - 4 - rr() * 6); }
        g.stroke();
        // concrete chunks and slabs
        const n = Math.floor(mw / 3);
        for (let k = 0; k < n; k++) {
          const t = rr() - 0.5, px = mx + t * mw;
          const hMax = mh * (1 - Math.abs(t) * 2);
          const py = GROUND_Y - rr() * hMax;
          const s = 2.5 + rr() * 4.5, slab = rr() < 0.15;
          g.save(); g.translate(px, py); g.rotate((rr() - 0.5) * 1.6);
          g.fillStyle = pal.rubble[Math.floor(rr() * 3)];
          g.beginPath();
          if (slab) { g.rect(-s * 2, -s * 0.4, s * 4, s * 0.8); }
          else { g.moveTo(-s, -s * 0.3); g.lineTo(-s * 0.2, -s * 0.9); g.lineTo(s, -s * 0.4); g.lineTo(s * 0.7, s * 0.6); g.lineTo(-s * 0.6, s * 0.5); g.closePath(); }
          g.fill();
          g.strokeStyle = pal.rubbleInk; g.lineWidth = 0.7; g.stroke();
          g.restore();
        }
      }
    }
  }

  function drawNearLayer(g, w, pal) {
    for (const b of NEAR_BLD) drawRuin(g, b, pal);
    drawRubble(g, w, pal);
  }

  // ---- live smoke and fires rising from the ruins
  let smoke = [];
  function forVisibleFires(fn) {
    for (const s of FIRE_SRC) for (const ox of [0, NEAR_W]) {
      const sx = s.x - nearOff + ox;
      if (sx > -30 && sx < W + 30) fn(sx, s.y, s);
    }
  }
  function updateSmoke(scrolling) {
    const dx = scrolling ? SPEED * 0.35 : 0;
    for (const p of smoke) { p.x -= dx + 0.12; p.y -= p.vy; p.r += 0.1; p.life--; }
    smoke = smoke.filter(p => p.life > 0 && p.x > -40);
    if (tick % 5 === 0) {
      forVisibleFires((sx, sy) => {
        const life = 110 + Math.random() * 50;
        smoke.push({ x: sx + (Math.random() - 0.5) * 5, y: sy - 4, r: 3 + Math.random() * 2, vy: 0.3 + Math.random() * 0.2, life, max: life });
      });
    }
  }
  function drawFires(pal) {
    forVisibleFires((sx, sy, s) => {
      const i = s.x;
      const glow = ctx.createRadialGradient(sx, sy, 1, sx, sy, 22);
      glow.addColorStop(0, `rgba(255,140,40,${pal.fireGlow})`);
      glow.addColorStop(1, 'rgba(255,120,30,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(sx - 22, sy - 22, 44, 44);
      const layers = [['#ff4e1a', 1], ['#ff9f2b', 0.68], ['#ffe17a', 0.38]];
      for (const [c, k] of layers) {
        const h = (9 + Math.sin(tick * 0.45 + i) * 2 + Math.sin(tick * 0.9 + i * 2)) * k;
        const wdt = 5 * k + 1;
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.moveTo(sx - wdt, sy + 2);
        ctx.quadraticCurveTo(sx - wdt, sy - h * 0.5, sx + Math.sin(tick * 0.3 + i) * 1.5, sy - h);
        ctx.quadraticCurveTo(sx + wdt, sy - h * 0.5, sx + wdt, sy + 2);
        ctx.closePath(); ctx.fill();
      }
    });
  }
  function drawSmoke(pal) {
    const [cr, cg, cb] = pal.smoke;
    for (const p of smoke) {
      const t = p.life / p.max;
      const a = pal.smokeA * Math.min(1, (1 - t) * 6) * t;
      ctx.fillStyle = `rgba(${cr},${cg},${cb},${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---------------------------------------------------------------- drawing: world
  const skyGrads = {};
  function drawSky(pal) {
    if (!skyGrads[palName]) {
      const gr = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      gr.addColorStop(0, pal.skyTop);
      gr.addColorStop(1, pal.skyBot);
      skyGrads[palName] = gr;
    }
    ctx.fillStyle = skyGrads[palName];
    ctx.fillRect(-12, -12, W + 24, GROUND_Y + 24);

    if (pal.stars) {
      ctx.fillStyle = '#ffffff';
      for (const [sx, sy, sz, ph] of stars) {
        ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(tick * 0.03 + ph));
        ctx.fillRect(sx, sy, sz, sz);
      }
      ctx.globalAlpha = 1;
    }
    // sun / moon
    const ox = 222, oy = 92;
    ctx.fillStyle = pal.orbGlow;
    ctx.beginPath(); ctx.arc(ox, oy, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = pal.orb;
    ctx.beginPath(); ctx.arc(ox, oy, 17, 0, Math.PI * 2); ctx.fill();
    if (pal.stars) {
      ctx.fillStyle = 'rgba(160,160,140,0.35)';
      ctx.beginPath(); ctx.arc(ox - 5, oy - 4, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ox + 6, oy + 5, 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawTile(img, off, w) {
    const x = Math.round(-off * K) / K;
    ctx.drawImage(img, x, LAYER_TOP, w, LAYER_H);
    ctx.drawImage(img, x + w, LAYER_TOP, w, LAYER_H);
  }

  const BRICK_H = 11, BRICK_W = 24;
  const BRICK_COLS = ['#b9472f', '#ad3f2a', '#c25339', '#a63a26', '#b44c34'];
  let wallShade = null, capShade = null;

  function brickRegion(y0, y1, anchor, seed) {
    if (y1 <= y0) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, y0, WALL_W, y1 - y0); ctx.clip();
    ctx.fillStyle = '#6e2716';
    ctx.fillRect(0, y0, WALL_W, y1 - y0);
    const k0 = Math.floor((y0 - anchor) / BRICK_H) - 1, k1 = Math.ceil((y1 - anchor) / BRICK_H);
    for (let k = k0; k <= k1; k++) {
      const ry = anchor + k * BRICK_H;
      const off = (k & 1) ? BRICK_W / 2 : 0;
      for (let j = -1, bx = -off; bx < WALL_W; j++, bx += BRICK_W) {
        ctx.fillStyle = BRICK_COLS[Math.floor(hash3(k, j, seed) * BRICK_COLS.length)];
        ctx.fillRect(bx + 1, ry + 1, BRICK_W - 2, BRICK_H - 2);
        ctx.fillStyle = 'rgba(255,200,170,0.22)';
        ctx.fillRect(bx + 1, ry + 1, BRICK_W - 2, 1.5);
      }
    }
    ctx.fillStyle = wallShade;
    ctx.fillRect(0, y0, WALL_W, y1 - y0);
    ctx.restore();
    ctx.strokeStyle = '#3d150b';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, y0, WALL_W, y1 - y0);
  }

  function drawCap(y) {
    const x = -CAP_OVER, w = WALL_W + CAP_OVER * 2;
    ctx.fillStyle = '#d3cbbd';
    ctx.fillRect(x, y, w, CAP_H);
    ctx.fillStyle = '#efe9df';
    ctx.fillRect(x, y + 1, w, 3);
    ctx.fillStyle = '#a49c8f';
    ctx.fillRect(x, y + CAP_H - 4, w, 3);
    ctx.fillStyle = capShade;
    ctx.fillRect(x, y, w, CAP_H);
    ctx.strokeStyle = '#4a3b2c';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, CAP_H);
  }

  function drawWall(w) {
    if (!wallShade) {
      wallShade = ctx.createLinearGradient(0, 0, WALL_W, 0);
      wallShade.addColorStop(0, 'rgba(0,0,0,0.30)');
      wallShade.addColorStop(0.22, 'rgba(255,255,255,0.14)');
      wallShade.addColorStop(0.5, 'rgba(0,0,0,0)');
      wallShade.addColorStop(1, 'rgba(0,0,0,0.34)');
      capShade = ctx.createLinearGradient(-CAP_OVER, 0, WALL_W + CAP_OVER, 0);
      capShade.addColorStop(0, 'rgba(0,0,0,0.18)');
      capShade.addColorStop(0.25, 'rgba(255,255,255,0.18)');
      capShade.addColorStop(1, 'rgba(0,0,0,0.25)');
    }
    ctx.save();
    ctx.translate(Math.round(w.x * K) / K, 0);
    const capTop = w.top - CAP_H, gb = w.top + GAP;
    brickRegion(-4, capTop, capTop, w.seed);
    brickRegion(gb + CAP_H, GROUND_Y + 2, gb + CAP_H, w.seed + 7);
    drawCap(capTop);
    drawCap(gb);
    ctx.restore();
  }

  function drawGround() {
    const y = GROUND_Y, o = groundOff;
    ctx.fillStyle = '#7f520f'; ctx.fillRect(-12, y, W + 24, 7);
    ctx.fillStyle = '#f0c14d'; ctx.fillRect(-12, y, W + 24, 5);
    ctx.fillStyle = '#fff0b2'; ctx.fillRect(-12, y, W + 24, 1.5);
    // red carpet
    ctx.fillStyle = '#c3262e'; ctx.fillRect(-12, y + 7, W + 24, 20);
    ctx.fillStyle = '#a81d25';
    ctx.beginPath();
    for (let x = -(o % 16) - 16; x < W + 24; x += 16) {
      ctx.moveTo(x, y + 27); ctx.lineTo(x + 8, y + 7); ctx.lineTo(x + 14, y + 7); ctx.lineTo(x + 6, y + 27);
    }
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(-12, y + 7, W + 24, 2);
    ctx.fillStyle = '#e1ad3b'; ctx.fillRect(-12, y + 27, W + 24, 3);
    ctx.fillStyle = '#6e440c'; ctx.fillRect(-12, y + 30, W + 24, 2);
    // broken concrete base
    ctx.fillStyle = '#9d907c'; ctx.fillRect(-12, y + 32, W + 24, H - y - 20);
    for (let x = -(o % 48) - 48; x < W + 48; x += 48) {
      for (const [cx, cy, s, rot, ci] of GROUND_CHUNKS) {
        ctx.save(); ctx.translate(x + cx, y + 32 + cy); ctx.rotate(rot);
        ctx.fillStyle = GROUND_COLS[ci];
        ctx.beginPath(); ctx.moveTo(-s, -s * 0.4); ctx.lineTo(-s * 0.1, -s * 0.8); ctx.lineTo(s, -s * 0.3); ctx.lineTo(s * 0.7, s * 0.6); ctx.lineTo(-s * 0.7, s * 0.5); ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(60,50,40,0.45)'; ctx.lineWidth = 0.8; ctx.stroke();
        ctx.restore();
      }
    }
    ctx.fillStyle = 'rgba(40,30,20,0.18)';
    ctx.fillRect(-12, y + 32, W + 24, 6);
  }

  // ---------------------------------------------------------------- drawing: the hero
  function wingPath(c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-5, -12, -17, -10);
    ctx.quadraticCurveTo(-13, -7, -16, -4);
    ctx.quadraticCurveTo(-11, -2, -13, 2);
    ctx.quadraticCurveTo(-6, 3.5, 0, 0);
    ctx.fill(); ctx.stroke();
  }

  let hairGrad = null;
  const SKIN = '#f0a467', CREASE = 'rgba(120,55,20,0.55)';
  function drawHero(x, y, rot, wingPhase, tieAng, scale) {
    const wa = Math.sin(wingPhase) * 0.65;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(scale, scale);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.lineWidth = 1.6; ctx.strokeStyle = INK;

    // back wing
    ctx.save(); ctx.translate(-11, 10); ctx.rotate(-0.25 + wa); wingPath('#d7dce3'); ctx.restore();

    // navy suit
    ctx.fillStyle = '#1f2940';
    ctx.beginPath();
    ctx.moveTo(-14, 23);
    ctx.lineTo(-14.5, 14);
    ctx.quadraticCurveTo(-14, 7.5, -6, 6.5);
    ctx.lineTo(6, 6.5);
    ctx.quadraticCurveTo(14, 7.5, 14.5, 14);
    ctx.lineTo(14, 23);
    ctx.quadraticCurveTo(0, 26.5, -14, 23);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // shirt
    ctx.fillStyle = '#f6ecd2';
    ctx.beginPath(); ctx.moveTo(-5.5, 6.5); ctx.lineTo(5.5, 6.5); ctx.lineTo(0, 19.5); ctx.closePath(); ctx.fill(); ctx.stroke();
    // lapels
    ctx.strokeStyle = '#0c1220'; ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(-7.5, 7.5); ctx.lineTo(-1, 20); ctx.moveTo(-9.5, 11); ctx.lineTo(-6.5, 12.5);
    ctx.moveTo(7.5, 7.5); ctx.lineTo(1, 20); ctx.moveTo(9.5, 11); ctx.lineTo(6.5, 12.5);
    ctx.moveTo(7.5, 18.5); ctx.lineTo(11.5, 18);
    ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.3;
    // collar points
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-5.5, 6.5); ctx.lineTo(-0.6, 8.6); ctx.lineTo(-3.2, 12.2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5.5, 6.5); ctx.lineTo(0.6, 8.6); ctx.lineTo(3.2, 12.2); ctx.closePath(); ctx.fill(); ctx.stroke();
    // red tie
    ctx.save(); ctx.translate(0, 8.4); ctx.rotate(tieAng * 0.5);
    ctx.fillStyle = '#c8322a';
    ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(2, 0); ctx.lineTo(1.5, 3); ctx.lineTo(-1.5, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1.5, 3); ctx.lineTo(1.5, 3); ctx.lineTo(3, 14); ctx.lineTo(0, 17.5); ctx.lineTo(-3, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(110,10,10,0.5)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(0.4, 4); ctx.lineTo(-0.6, 14); ctx.stroke();
    ctx.restore();
    ctx.lineWidth = 1.6; ctx.strokeStyle = INK;

    // front wing
    ctx.save(); ctx.translate(-12, 12); ctx.rotate(-0.1 + wa); wingPath('#ffffff'); ctx.restore();

    // ears
    ctx.fillStyle = SKIN;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(14.6 * s, -3.5, 3, 4.3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    // face: wide, with heavy jowls
    ctx.beginPath();
    ctx.moveTo(-12.5, -16);
    ctx.bezierCurveTo(-15.8, -8, -15.8, 2.5, -11, 7.2);
    ctx.bezierCurveTo(-7, 11.5, 7, 11.5, 11, 7.2);
    ctx.bezierCurveTo(15.8, 2.5, 15.8, -8, 12.5, -16);
    ctx.bezierCurveTo(8, -22, -8, -22, -12.5, -16);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // cheeks
    ctx.fillStyle = 'rgba(215,105,55,0.28)';
    ctx.beginPath(); ctx.arc(-9, 2, 4, 0, Math.PI * 2); ctx.arc(9, 2, 4, 0, Math.PI * 2); ctx.fill();
    // pale squinted eye areas
    ctx.fillStyle = '#f9e0bd';
    ctx.beginPath(); ctx.ellipse(-6, -6.8, 4.4, 2.8, 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, -6.8, 4.4, 2.8, -0.12, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(-9.6, -6.6); ctx.quadraticCurveTo(-6, -8.6, -2.6, -6.4);
    ctx.moveTo(9.6, -6.6); ctx.quadraticCurveTo(6, -8.6, 2.6, -6.4);
    ctx.stroke();
    // wrinkles
    ctx.strokeStyle = CREASE; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-10.6, -7.6); ctx.lineTo(-12.4, -8.6); ctx.moveTo(-10.6, -6); ctx.lineTo(-12.4, -5.4);
    ctx.moveTo(10.6, -7.6); ctx.lineTo(12.4, -8.6); ctx.moveTo(10.6, -6); ctx.lineTo(12.4, -5.4);
    ctx.moveTo(-1, -12.5); ctx.lineTo(-0.6, -9.6); ctx.moveTo(1, -12.5); ctx.lineTo(0.6, -9.6);
    ctx.moveTo(-5, 2.5); ctx.quadraticCurveTo(-6, 5, -4.6, 7.5);
    ctx.moveTo(5, 2.5); ctx.quadraticCurveTo(6, 5, 4.6, 7.5);
    ctx.moveTo(-4.5, 9.6); ctx.quadraticCurveTo(0, 11.6, 4.5, 9.6);
    ctx.stroke();
    // angry brows
    ctx.strokeStyle = INK; ctx.lineWidth = 3.6;
    ctx.beginPath();
    ctx.moveTo(-10.6, -11.4); ctx.quadraticCurveTo(-7, -12.8, -2.4, -9.6);
    ctx.moveTo(10.6, -11.4); ctx.quadraticCurveTo(7, -12.8, 2.4, -9.6);
    ctx.stroke();
    ctx.strokeStyle = '#e3ab2e'; ctx.lineWidth = 2.1;
    ctx.stroke();
    // bulbous nose
    ctx.strokeStyle = INK; ctx.lineWidth = 1.3;
    ctx.fillStyle = '#eb9659';
    ctx.beginPath();
    ctx.moveTo(-1.6, -6.2);
    ctx.quadraticCurveTo(-2.4, -3.4, -4.3, -1.3);
    ctx.quadraticCurveTo(-5.4, 1.7, -2, 1.8);
    ctx.quadraticCurveTo(0, 2.8, 2, 1.8);
    ctx.quadraticCurveTo(5.4, 1.7, 4.3, -1.3);
    ctx.quadraticCurveTo(2.4, -3.4, 1.6, -6.2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,230,200,0.6)';
    ctx.beginPath(); ctx.ellipse(-1, -1.2, 1.1, 1.4, 0, 0, Math.PI * 2); ctx.fill();
    // shouting mouth
    ctx.fillStyle = '#7d2a1c';
    ctx.beginPath(); ctx.ellipse(0, 5.4, 3.4, 2.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-3, 2.2, 6, 1.6);
    ctx.fillStyle = '#d65c4c'; ctx.beginPath(); ctx.ellipse(0, 7.6, 2.5, 1.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.lineWidth = 1.5; ctx.stroke();

    // golden swoop hair
    if (!hairGrad) {
      hairGrad = ctx.createLinearGradient(0, -28, 0, -5);
      hairGrad.addColorStop(0, '#fff2a8');
      hairGrad.addColorStop(0.5, '#f6cd4c');
      hairGrad.addColorStop(1, '#dba12a');
    }
    ctx.fillStyle = hairGrad; ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-14.2, -5.5);
    ctx.bezierCurveTo(-17.5, -14, -14, -22.5, -6, -25.5);
    ctx.bezierCurveTo(2, -28.5, 14, -26.5, 20, -22.5);
    ctx.bezierCurveTo(23, -21.2, 25, -19.6, 27.5, -18.4);
    ctx.bezierCurveTo(22.5, -17.8, 18.5, -17.2, 16.2, -15.2);
    ctx.bezierCurveTo(17.4, -11, 16.2, -7, 14.4, -4.6);
    ctx.bezierCurveTo(13.2, -9.6, 11.2, -13.6, 8, -14.8);
    ctx.bezierCurveTo(2, -16, -6, -17.2, -10, -14.2);
    ctx.bezierCurveTo(-12, -12.2, -12.6, -9, -14.2, -5.5);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#c98f1f'; ctx.lineWidth = 0.95;
    ctx.beginPath();
    ctx.moveTo(-12, -14.5); ctx.quadraticCurveTo(0, -24.5, 18.5, -20.6);
    ctx.moveTo(-8, -19); ctx.quadraticCurveTo(4, -25.5, 16, -23);
    ctx.moveTo(-13.2, -9.5); ctx.quadraticCurveTo(-6, -16.5, 6, -16.8);
    ctx.moveTo(10.5, -15.4); ctx.quadraticCurveTo(14.4, -14.6, 15, -9);
    ctx.stroke();

    ctx.restore();
  }

  // ---------------------------------------------------------------- drawing: UI
  function text(str, x, y, size, fill, opts) {
    const o = opts || {};
    ctx.font = `${size}px ${FONT}`;
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    const lw = o.lw !== undefined ? o.lw : size * 0.24;
    if (o.shadow !== false && lw > 0) {
      ctx.fillStyle = o.shadow || 'rgba(0,0,0,0.35)';
      ctx.strokeStyle = o.shadow || 'rgba(0,0,0,0.35)';
      ctx.lineWidth = lw;
      ctx.strokeText(str, x, y + size * 0.09);
      ctx.fillText(str, x, y + size * 0.09);
    }
    if (lw > 0) {
      ctx.strokeStyle = o.stroke || INK;
      ctx.lineWidth = lw;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  function button(b, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    roundRect(ctx, b.x, b.y + 4, b.w, b.h, 10);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
    roundRect(ctx, b.x, b.y, b.w, b.h, 10);
    ctx.fillStyle = INK; ctx.fill();
    roundRect(ctx, b.x + 3, b.y + 3, b.w - 6, b.h - 6, 8);
    const gr = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    gr.addColorStop(0, '#ffe27a'); gr.addColorStop(1, '#ee9b1e');
    ctx.fillStyle = gr; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    roundRect(ctx, b.x + 7, b.y + 6, b.w - 14, 5, 2.5); ctx.fill();
    text(b.label, b.x + b.w / 2, b.y + b.h / 2 + 2, Math.round(b.h * 0.5), '#ffffff', { lw: 5, shadow: false });
    ctx.restore();
  }

  function muteIcon() {
    const b = BTN.mute;
    ctx.save();
    roundRect(ctx, b.x, b.y, b.w, b.h, 7);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    ctx.translate(b.x + 8, b.y + 15);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(0, -3.5); ctx.lineTo(3.5, -3.5); ctx.lineTo(8, -8); ctx.lineTo(8, 8); ctx.lineTo(3.5, 3.5); ctx.lineTo(0, 3.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    if (Sound.muted) { ctx.moveTo(11, -4); ctx.lineTo(17, 4); ctx.moveTo(17, -4); ctx.lineTo(11, 4); }
    else { ctx.arc(9, 0, 5, -0.9, 0.9); ctx.moveTo(14.5, -6.5); ctx.arc(9, 0, 8.5, -0.85, 0.85); }
    ctx.stroke();
    ctx.restore();
  }

  function drawLogo(y) {
    const wob = Math.sin(tick * 0.05) * 0.03;
    ctx.save();
    ctx.translate(W / 2, y);
    ctx.rotate(wob);
    text('FLAPPY', 0, -26, 46, '#ffffff', { lw: 10 });
    text('TRUMP', 0, 22, 58, '#ffcf3f', { lw: 11, stroke: '#4e1f07' });
    ctx.restore();
    text('MAKE FLAPPING GREAT AGAIN', W / 2, y + 62, 13, '#ffffff', { lw: 4 });
  }

  function drawMedal(cx, cy, m, t) {
    const s = Math.min(1, easeOutBack(Math.min(1, t / 18)));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    const [hi, mid, dk] = m.c;
    // ribbon
    ctx.fillStyle = '#1d3a8a';
    ctx.beginPath(); ctx.moveTo(-10, -26); ctx.lineTo(-3, -14); ctx.lineTo(-11, -14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c3262e';
    ctx.beginPath(); ctx.moveTo(10, -26); ctx.lineTo(3, -14); ctx.lineTo(11, -14); ctx.closePath(); ctx.fill();
    const gr = ctx.createRadialGradient(-6, -6, 2, 0, 0, 22);
    gr.addColorStop(0, hi); gr.addColorStop(0.7, mid); gr.addColorStop(1, dk);
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = dk; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
    // star
    ctx.fillStyle = dk;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 4.4 : 10;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    // sparkle
    const sp = Math.floor(t / 26), ph = (t % 26) / 26;
    const sx = (hash3(sp, 1, 3) - 0.5) * 30, sy = (hash3(sp, 2, 5) - 0.5) * 30;
    const ss = Math.sin(ph * Math.PI) * 4.5;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(sx, sy - ss); ctx.lineTo(sx + ss * 0.3, sy); ctx.lineTo(sx, sy + ss); ctx.lineTo(sx - ss * 0.3, sy); ctx.closePath();
    ctx.moveTo(sx - ss, sy); ctx.lineTo(sx, sy + ss * 0.3); ctx.lineTo(sx + ss, sy); ctx.lineTo(sx, sy - ss * 0.3); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPanel(py) {
    const pw = 228, ph = 118, px = (W - pw) / 2;
    roundRect(ctx, px, py + 4, pw, ph, 12); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
    roundRect(ctx, px, py, pw, ph, 12); ctx.fillStyle = INK; ctx.fill();
    roundRect(ctx, px + 3, py + 3, pw - 6, ph - 6, 10); ctx.fillStyle = '#f7e8bb'; ctx.fill();
    roundRect(ctx, px + 7, py + 7, pw - 14, ph - 14, 7); ctx.strokeStyle = '#ddbd78'; ctx.lineWidth = 2; ctx.stroke();

    const plain = { lw: 0, shadow: false };
    text('MEDAL', px + 52, py + 22, 13, '#e06a26', plain);
    ctx.fillStyle = '#e3cc8b';
    ctx.beginPath(); ctx.arc(px + 52, py + 68, 23, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#cfae64'; ctx.lineWidth = 2; ctx.stroke();
    if (medal && medalT > 0) drawMedal(px + 52, py + 68, medal, medalT);

    const rx = px + pw - 20;
    text('SCORE', rx, py + 22, 13, '#e06a26', { ...plain, align: 'right' });
    text(String(displayScore), rx, py + 46, 28, '#ffffff', { lw: 6, align: 'right', shadow: false });
    text('BEST', rx, py + 72, 13, '#e06a26', { ...plain, align: 'right' });
    text(String(best), rx, py + 96, 28, '#ffffff', { lw: 6, align: 'right', shadow: false });

    if (newBest && displayScore >= score) {
      const nx = rx - 84, ny = py + 64;
      roundRect(ctx, nx, ny, 38, 16, 5); ctx.fillStyle = '#e8262e'; ctx.fill();
      text('NEW', nx + 19, ny + 9, 12, '#ffffff', plain);
    }
  }

  function drawTapHint(cx, cy) {
    const b = Math.sin(tick * 0.12) * 3;
    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    // arrow
    ctx.beginPath();
    ctx.moveTo(cx, cy - 30 + b); ctx.lineTo(cx + 11, cy - 17 + b); ctx.lineTo(cx + 4, cy - 17 + b);
    ctx.lineTo(cx + 4, cy - 8 + b); ctx.lineTo(cx - 4, cy - 8 + b); ctx.lineTo(cx - 4, cy - 17 + b); ctx.lineTo(cx - 11, cy - 17 + b);
    ctx.closePath(); ctx.stroke(); ctx.fill();
    ctx.restore();
    roundRect(ctx, cx - 28, cy - 2, 56, 26, 9);
    ctx.fillStyle = INK; ctx.fill();
    roundRect(ctx, cx - 25, cy + 1, 50, 20, 7);
    ctx.fillStyle = '#e8262e'; ctx.fill();
    text('TAP', cx, cy + 12, 16, '#ffffff', { lw: 0, shadow: false });
  }

  function drawUI() {
    switch (state) {
      case 'title': {
        drawLogo(118);
        button(BTN.titlePlay, 1);
        text('BEST: ' + best, W / 2, 392, 16, '#ffffff', { lw: 5 });
        muteIcon();
        break;
      }
      case 'ready': {
        text(String(score), W / 2, 64, 46, '#ffffff', { lw: 9 });
        text('GET READY!', W / 2, 146, 38, '#ffcf3f', { lw: 9, stroke: '#4e1f07' });
        drawTapHint(W / 2 + 34, 262);
        text('CLICK  •  TAP  •  SPACE', W / 2, 318, 12, '#ffffff', { lw: 4 });
        break;
      }
      case 'play':
      case 'dying': {
        text(String(score), W / 2, 64, 46, '#ffffff', { lw: 9 });
        for (const p of popups) {
          const a = Math.min(1, p.life / 20);
          const s = 22 + (1 - Math.min(1, (70 - p.life) / 10)) * 10;
          ctx.save(); ctx.globalAlpha = a;
          text(p.text, W / 2, p.y, Math.round(s), '#ffcf3f', { lw: 6, stroke: '#4e1f07' });
          ctx.restore();
        }
        break;
      }
      case 'over': {
        const t1 = clamp(overT / 18, 0, 1);
        ctx.save();
        ctx.globalAlpha = t1;
        text("YOU'RE FIRED!", W / 2, 110 + (1 - easeOutBack(t1)) * -24, 36, '#ffcf3f', { lw: 9, stroke: '#4e1f07' });
        ctx.restore();
        const t2 = clamp((overT - 20) / 24, 0, 1);
        if (t2 > 0) drawPanel(174 + (1 - easeOutCubic(t2)) * (H - 174));
        if (overT > 46) {
          const a = clamp((overT - 46) / 10, 0, 1);
          button(BTN.overPlay, a);
          button(BTN.overMenu, a);
          if (a >= 1) muteIcon();
        }
        break;
      }
    }
  }

  // ---------------------------------------------------------------- render
  function render() {
    ctx.setTransform(K, 0, 0, K, 0, 0);
    const pal = PALETTES[palName];
    const layers = getLayers(palName);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake * 0.35, (Math.random() * 2 - 1) * shake * 0.35);
    drawSky(pal);
    drawTile(layers.far, farOff, FAR_W);
    drawTile(layers.near, nearOff, NEAR_W);
    drawFires(pal);
    drawSmoke(pal);
    for (const w of walls) drawWall(w);
    drawGround();
    drawHero(bird.x, bird.y, bird.rot, bird.wing, bird.tie, state === 'title' ? 1.2 : HERO_S);
    ctx.restore();

    drawUI();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------------------------------------------------------------- loop
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= STEP_MS) { update(); acc -= STEP_MS; }
    render();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });
  if (document.fonts && document.fonts.load) document.fonts.load(`20px "Luckiest Guy"`).catch(() => {});
  requestAnimationFrame(frame);

  // read-only hook for automated tests
  window.FlappyTrump = {
    get state() { return state; },
    get score() { return score; },
    get bird() { return { x: bird.x, y: bird.y, vel: bird.vel }; },
    get walls() { return walls.map(w => ({ x: w.x, top: w.top, bottom: w.top + GAP })); },
  };
})();
</script>
</body>
</html>
